<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contato</title>

<!-- Ícones -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>

body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #6a11cb, #2575fc);
}

.card {
    background: #2dd4bf;
    padding: 20px;
    border-radius: 15px;
    width: 260px;
    text-align: center;
    color: white;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.imgperfil {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 4px solid #00ffcc;
    object-fit: cover;
}

h2 {
    margin: 10px 0 5px;
}

.local, .job {
    font-size: 14px;
    opacity: 0.9;
}

.botoes {
    margin: 15px 0;
}

button {
    border: none;
    padding: 8px 12px;
    margin: 5px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.primario {
    background: white;
    color: #2dd4bf;
}

.secundario {
    background: #0f766e;
    color: white;
}

.skills h3 {
    margin-bottom: 5px;
}

.tags span {
    display: inline-block;
    background: rgba(255,255,255,0.2);
    padding: 5px 8px;
    margin: 3px;
    border-radius: 5px;
    font-size: 12px;
}

.social {
    margin-top: 10px;
}

.social a {
    color: white;
    text-decoration: none;
}

.social i {
    margin: 0 8px;
    cursor: pointer;
    font-size: 18px;
}

</style>
</head>

<body>

<div class="card">

    <img src="perfil.png" alt="Foto de Perfil" class="imgperfil">
    <h2>Gabriel Hernan</h2>
    <div class="local">Montes Claros - MG</div>
    <div class="job">Tec Informática</div>

    <div class="botoes">
       <a href="https://wa.me/5538988010176?text=Olá,%20vim%20pelo%20card." target="_blank">
        <button class="primario">Mensagem</button>
        </a>
        <button class="secundario">Follow</button>
    </div>

    <div class="skills">
        <h3>Habilidades</h3>
        <div class="tags">
            <span>Tec Informática</span>
            <span>Inglês Avançado</span>
            <span>HTML</span>
            <span>CSS</span>
        </div>
    </div>

    <div class="social">

    
        <a href="https://www.tiktok.com/@gagau_._?_r=1&_t=ZS-95cF4DcOe82" target="_blank">
            <i class="fab fa-tiktok"></i>
        </a>

          <a href="https://instagram.com/ga.briel1307_" target="_blank">
            <i class="fab fa-instagram"></i>
        </a>

    </div>

</div>

</body>
</html>
